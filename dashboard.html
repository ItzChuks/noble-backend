<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.js"></script><script src="mock.js"></script><script src="pdf.js"></script><script src="app.js"></script><link rel="icon" href="logo.jpeg"><title>Dashboard – Nobles Groceries</title></head>
<body class="bg-slate-50 text-slate-800"><div id="app"></div>
<script>
if (guard()) {
const U = () => pb.authStore.record, uf = () => 'user="' + U().id + '"';
const planOf = s => s.expand?.plan || {};
const subs = () => pb.collection('subscriptions').getFullList({ filter: uf(), expand: 'plan', sort: '-created' });
const pays = () => pb.collection('payments').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' });
// progress counts savings only: late penalties are fees, not savings
const sum = (l, s) => l.filter(p => p.status === 'confirmed' && (!s || p.subscription === s)).reduce((a, p) => a + p.amount - (p.penalty || 0), 0);
const bar = pc => `<div class="h-1.5 bg-slate-100 rounded-full mt-3"><div class="h-1.5 bg-emerald-700 rounded-full" style="width:${pc}%"></div></div>`;
const dueLine = (st, f) => !st.left ? '<span class="text-emerald-800 font-medium">Fully paid</span>'
  : st.overdue ? `<span class="text-red-600 font-medium">${plural(st.overdue, f)} overdue · ${naira(st.overdue * st.A * RULES.lateMultiplier)} due now (includes ${naira(st.overdue * st.pen)} penalty)</span>`
  : `Next payment due <b class="font-medium text-slate-700">${fmtDue(f, st.next)}</b>`;

window.PLAN_ACTION = p => `<button onclick="closePlan();join('${p.id}')" class="${btn} w-full py-2.5">Join this plan</button>`;
// Joining a plan: the ₦3,000 joining fee is paid first; the server then joins the plan automatically once Flutterwave confirms it.
window.join = async id => {
  const pl = (window._pl || []).find(p => p.id === id) || await pb.collection('plans').getOne(id).catch(() => null);
  if (!pl) return toast('That plan could not be found.', 1);
  const row = (k, v) => `<div class="flex justify-between gap-4 py-2 text-sm"><dt class="text-slate-500">${k}</dt><dd class="font-medium text-slate-900 text-right">${v}</dd></div>`;
  modal('Join ' + esc(pl.name),
    `<dl class="divide-y border rounded-lg px-3">${row('Contribution', naira(pl.amount) + ' / ' + FQ[pl.frequency])}${row('Number of payments', pl.duration + ' ' + FQ[pl.frequency] + (pl.duration === 1 ? '' : 's'))}${row('Total payout', naira(pl.payout))}</dl>`
    + `<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-800 p-3 text-sm">A joining fee of <b>${naira(FEES.join)}</b> is paid before you join any plan. You join as soon as the payment is confirmed.</div>`
    + '<p class="text-xs text-slate-500">You will pay securely on Flutterwave. By joining you agree to the <a href="terms.html" target="_blank" class="text-emerald-800 underline">Terms and Conditions</a>.</p>',
    async () => { await payFee({ type: 'join', plan: id }); toast('Plan joined (demo)'); location.hash = 'mine'; },
    'Pay ' + naira(FEES.join) + ' and join');
};

// Payment form: enforces the lateness penalty, accepts advance payments, shows what the amount covers and the next due date
window.pay = async sid => {
  const [s, all] = await Promise.all([subs(), pays()]), sub = s.find(x => x.id === sid), pl = planOf(sub), f = pl.frequency, m = RULES.lateMultiplier;
  const st0 = planState(sub, pl, all);
  if (!st0.left) return toast('This plan is already fully paid.', 1);
  modal('Pay for ' + esc(pl.name),
    '<div id="qh"></div>' + fld('Amount (₦)', 'amount', st0.cost(0), 'number', 'required min="1" step="1"') + '<div id="qv"></div><p class="text-xs text-slate-500">You will pay securely on Flutterwave (card, bank transfer or USSD). Your payment is confirmed automatically as soon as it goes through.</p>',
    async d => {
      const st = planState(sub, pl, await pays()), q = quoteFor(st, +d.amount);
      if (!q.ok) { paint(); throw new Error('The amount due has changed (a deadline may have just passed). Please check the new amount.'); }
      // the server re-checks the amount, records a pending payment and returns a Flutterwave checkout link
      const r = await pb.send('/api/noble/pay/init', { method: 'POST', body: { subscription: sid, amount: q.total } });
      if (r.link) { toast('Taking you to Flutterwave…'); location.href = r.link; await new Promise(() => { }); }   // stay on this pop-up until the browser leaves
      toast(`${naira(q.total)} paid (demo) · covers ${plural(q.n, f)}`, 0, 6000);
    }, 'Pay with Flutterwave');
  const am = $('input[name="amount"]'), qh = $('#qh'), qv = $('#qv');
  const box = (c, h) => `<div class="rounded-lg border p-3 text-sm ${c}">${h}</div>`;
  const paint = () => {
    const st = planState(sub, pl, all), amt = +am.value, q = quoteFor(st, amt);
    qh.innerHTML = st.overdue
      ? box('bg-red-50 border-red-200 text-red-700', `<b>Payment overdue.</b> ${plural(st.overdue, f)} missed. Each costs ${naira(st.A)} + ${naira(st.pen)} late penalty = ${naira(st.A * m)}. Minimum to pay now: ${naira(st.cost(0))}.`)
      : box('bg-emerald-50 border-emerald-200 text-emerald-800', `Next payment due <b>${fmtDue(f, st.next)}</b>. Pay before then to avoid the ${naira(st.pen)} late penalty.`);
    if (!(amt > 0)) qv.innerHTML = '<p class="text-slate-500">Enter an amount.</p>';
    else if (q.ok) qv.innerHTML = `<p class="font-medium text-slate-900">Covers ${plural(q.n, f)}</p><p class="text-slate-600 mt-1">Savings ${naira(q.base)}${q.penalty ? ` + <span class="text-amber-800 font-medium">late penalty ${naira(q.penalty)}</span> (${plural(q.late, f)} late)` : ''}</p><p class="text-slate-600 mt-1">${q.next ? `Next payment due <b>${fmtDue(f, q.next)}</b>` : 'This completes your plan.'}</p>`;
    else {
      const why = amt < st.cost(0) ? `The minimum payment is ${naira(st.cost(0))}${st.overdue ? ' (includes the late penalty)' : ''}.` : amt > q.max ? `That is more than the remaining balance of ${naira(q.max)}.` : `${naira(amt)} is not a whole number of payments.`;
      const opts = [...new Set([q.lower, q.higher].filter(Boolean))];
      qv.innerHTML = `<p class="text-red-600">${why}</p><div class="flex flex-wrap gap-2 mt-2">${opts.map(v => `<button type="button" data-amt="${v}" class="${btn2} !py-1 !px-2.5 text-xs">Pay ${naira(v)} · ${plural(q.cum.indexOf(v), f)}</button>`).join('')}</div>`;
    }
  };
  qv.onclick = e => { const b = e.target.closest('[data-amt]'); if (b) { am.value = b.dataset.amt; paint(); } };
  am.oninput = paint; paint();
  const iv = setInterval(() => document.body.contains(am) ? paint() : clearInterval(iv), 15000);   // re-check when a deadline passes
};
// Requesting a payout: the ₦3,000 clearance fee is paid first; the server sends the request once Flutterwave confirms it.
window.payout = sid => modal('Request payout',
  `<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-800 p-3 text-sm">A clearance fee of <b>${naira(FEES.clearance)}</b> is paid with every payout request. Your request is sent to the admin as soon as the fee is confirmed.</div>` + fld('Delivery or bank details', 'note', '', 'text', 'required'),
  async d => { await payFee({ type: 'clearance', subscription: sid, details: d.note }); toast('Payout requested (demo)'); },
  'Pay ' + naira(FEES.clearance) + ' and request payout');

// The t-shirt fee comes first: until it is paid the member only sees this page (the server enforces it as well).
const needShirt = () => U().role !== 'admin' && !U().shirt_paid;
function gate() {
  const u = U();
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4 bg-slate-50"><div class="w-full max-w-lg bg-white border rounded-2xl p-6 sm:p-8 shadow-sm">
    <div class="flex items-center gap-3"><img src="logo.jpeg" alt="" class="w-10 h-10 rounded-lg object-cover"><span class="font-semibold text-slate-900">Nobles Groceries</span></div>
    <h1 class="text-xl font-semibold text-slate-900 mt-6">Complete your registration</h1>
    <p class="text-sm text-slate-600 mt-2 leading-relaxed">Welcome${u.name ? ', ' + esc(u.name.split(' ')[0]) : ''}. Every member pays a one-time <b>${naira(FEES.shirt)}</b> for the Nobles Groceries t-shirt. Until it is paid you are an unregistered member and cannot join a plan, make a payment or request a payout.</p>
    <button id="gp" class="${btn} w-full py-2.5 mt-5">Pay ${naira(FEES.shirt)} with Flutterwave</button>
    <p class="text-xs text-slate-500 mt-2">You pay securely on Flutterwave. Your account is registered automatically as soon as the payment is confirmed.</p>
    <details class="mt-6 text-sm"><summary class="cursor-pointer font-medium text-slate-700">Other fees you should know about</summary><p class="mt-2 text-slate-600 leading-relaxed">A joining fee of <b>${naira(FEES.join)}</b> is paid each time you join a plan, and a clearance fee of <b>${naira(FEES.clearance)}</b> is paid with every payout request. <a href="terms.html" target="_blank" class="text-emerald-800 underline">Read the full terms</a>.</p></details>
    <div class="flex items-center justify-between mt-6 pt-4 border-t text-sm"><a href="${waLink()}" target="_blank" rel="noopener" class="text-slate-600 hover:text-slate-900">Customer support</a><button onclick="logout()" class="text-slate-600 hover:text-slate-900">Log out</button></div></div></div>`;
  $('#gp').onclick = async () => {
    const b = $('#gp'), t = b.textContent; b.disabled = true; b.textContent = 'Please wait…';
    try { await payFee({ type: 'shirt' }); toast('T-shirt fee paid (demo). You are now registered.'); setTimeout(() => location.reload(), 800); }
    catch (x) { toast(x.message, 1); b.disabled = false; b.textContent = t; }
  };
  // the payment may be confirmed by Flutterwave's webhook while this page is open
  setInterval(async () => { try { await pb.collection('users').authRefresh(); if (U().shirt_paid) location.reload(); } catch (x) { } }, 6000);
}

const startApp = () => layout({ brand: "Nobles Groceries", nav: [['overview', 'Overview'], ['plans', 'Browse plans'], ['mine', 'My contributions'], ['payments', 'Transaction history'], ['fees', 'Fees paid'], ['payouts', 'Payouts'], ['rules', 'Rules and fees'], ['profile', 'Profile']], views: {
  async overview(m) {
    const [s, p] = await Promise.all([subs(), pays()]), act = s.filter(x => x.status === 'active');
    m.innerHTML = head('Welcome back, ' + esc((U().name || 'there').split(' ')[0]), 'A summary of your savings activity.', `<a href="#plans" class="${btn}">Browse plans</a>`)
      + '<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8">' + stat('Active plans', act.length) + stat('Total contributed', naira(sum(p)), 'Confirmed savings, excluding penalties') + stat('Awaiting confirmation', p.filter(x => x.status === 'pending').length, 'Payments under review') + stat('Expected payout', naira(act.reduce((a, x) => a + (planOf(x).payout || 0), 0)), 'Across active plans') + '</div>'
      + '<div class="grid lg:grid-cols-5 gap-6"><div class="lg:col-span-2"><h2 class="text-sm font-semibold mb-3">Active plans</h2>' + (act.length ? '<div class="space-y-3">' + act.map(x => { const pl = planOf(x), t = pl.amount * pl.duration, pc = Math.min(100, Math.round(sum(p, x.id) / t * 100) || 0); return `<a href="#mine" class="block bg-white border rounded-xl p-4 hover:border-emerald-700"><div class="flex justify-between text-sm"><span class="font-medium">${esc(pl.name)}</span><span class="text-slate-500">${pc}%</span></div>${bar(pc)}<p class="text-xs text-slate-500 mt-2">${dueLine(planState(x, pl, p), pl.frequency)}</p></a>`; }).join('') + '</div>' : `<div class="bg-white border border-dashed rounded-xl p-6 text-sm text-slate-500">You have not joined a plan yet. <a href="#plans" class="text-emerald-800 font-medium">Browse plans</a></div>`) + '</div>'
      + '<div class="lg:col-span-3"><div class="flex justify-between mb-3"><h2 class="text-sm font-semibold">Recent payments</h2><a href="#payments" class="text-sm text-emerald-800 font-medium">View all</a></div>' + table(['Date', 'Plan', 'Amount', 'Status'], p.slice(0, 5).map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), naira(x.amount), badge(x.status)])) + '</div></div>';
  },
  async plans(m) {
    const l = await pb.collection('plans').getFullList({ filter: 'active=true' });
    m.innerHTML = head('Browse plans', 'Search, filter and compare every plan, then join. A ' + naira(FEES.join) + ' joining fee applies each time you join a plan.') + '<div id="ex"></div>';
    explorer($('#ex'), l, { quick: p => `<button onclick="join('${p.id}')" class="${btn} flex-1">Join plan</button>` });
  },
  async mine(m) {
    const [s, p, po] = await Promise.all([subs(), pays(), pb.collection('payouts').getFullList({ filter: uf() })]);
    m.innerHTML = head('My contributions', 'Track progress, due dates and penalties on every plan you have joined.') + (s.length ? '<div class="grid md:grid-cols-2 gap-4">' + s.map(x => {
      const pl = planOf(x), t = pl.amount * pl.duration, paid = sum(p, x.id), pc = Math.min(100, Math.round(paid / t * 100) || 0), st = planState(x, pl, p);
      // payouts open only once the whole saving period has run its course (and every payment is confirmed)
      const end = termEnd(x, pl), over = Date.now() >= end.getTime(), reqs = po.filter(o => o.subscription === x.id), done = reqs.some(o => o.status === 'confirmed'), asked = reqs.some(o => o.status === 'pending');
      const payAct = paid < t || x.status === 'cancelled' ? '' : done ? '<span class="text-sm font-medium text-emerald-800 self-center">Paid out</span>'
        : asked ? '<span class="text-sm font-medium text-amber-800 self-center">Payout requested · awaiting admin</span>'
        : over ? `<button onclick="payout('${x.id}')" class="${btn2}">Request payout</button>`
        : `<button disabled title="Opens ${fmtDay(end)}" class="${btn2} opacity-50 cursor-not-allowed">Request payout</button>`;
      const termLine = x.status === 'cancelled' || done ? '' : `<p class="text-xs text-slate-500 mt-1">${over ? 'Saving period complete.' : `Saving period ends <b class="font-medium text-slate-700">${fmtDay(end)}</b>. Payout opens then.`}</p>`;
      return `<div class="bg-white border rounded-xl p-5"><div class="flex justify-between items-start gap-3"><h3 class="font-semibold">${esc(pl.name)}</h3>${badge(x.status)}</div><p class="text-sm text-slate-500 mt-1">${naira(pl.amount)} ${pl.frequency} · ${monthsLabel(pl)} · started ${date(x.created)}</p>${bar(pc)}<p class="text-sm mt-2">${naira(paid)} of ${naira(t)} <span class="text-slate-500">(${pc}%)</span></p><p class="text-xs text-slate-500 mt-1">${st.paid} of ${pl.duration} ${FQ[pl.frequency]}s covered (including payments awaiting confirmation)</p>${termLine}${x.status === 'active' ? `<p class="text-sm text-slate-500 mt-3">${dueLine(st, pl.frequency)}</p>` : ''}<div class="flex flex-wrap gap-2 mt-4">${x.status === 'active' && st.left ? `<button onclick="pay('${x.id}')" class="${btn}">Make payment</button>` : ''}${payAct}</div></div>`;
    }).join('') + '</div>' : table([], []));
  },
  async payments(m) {
    const [p, o] = await Promise.all([pays(), pb.collection('payouts').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' })]);
    m.innerHTML = head('Transaction history', 'Every payment and payout. Filter by date and download invoices as PDF.') + '<div id="th"></div>';
    txHistory($('#th'), { key: 'me', cust: U(), txs: [...p.map(x => txFrom(x, 'payment')), ...o.map(x => txFrom(x, 'payout'))].sort((a, b) => b.at - a.at) });
  },
  async fees(m) {
    const l = await pb.collection('fees').getFullList({ filter: uf(), expand: 'plan', sort: '-created' });
    m.innerHTML = head('Fees paid', 'Your t-shirt registration, joining and payout clearance fees.') + table(['Date', 'Fee', 'Plan', 'Amount', 'Status'], l.map(x => [date(x.created), FEE_LABEL[x.type] || x.type, esc(x.expand?.plan?.name || '—'), naira(x.amount), badge(x.status)]));
  },
  async payouts(m) { const l = await pb.collection('payouts').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' }); m.innerHTML = head('Payouts', 'Your payout requests.') + table(['Date', 'Plan', 'Details', 'Status'], l.map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), esc(x.note), badge(x.status)])); },
  async rules(m) { m.innerHTML = head('Rules and fees', 'Fees, due dates, late penalties and advance payments. These are part of the <a href="terms.html" target="_blank" class="text-emerald-800 underline">Terms and Conditions</a>.') + rulesHTML(); },
  async profile(m) {
    const u = U(); m.innerHTML = head('Profile', 'Update your details.') + `<form id="pf2" class="bg-white border rounded-xl p-6 max-w-md space-y-3">${fld('Full name', 'name', u.name)}${fld('Country', 'country', u.country)}${fld('Phone', 'phone', u.phone)}<button class="${btn}">Save changes</button></form>`;
    $('#pf2').onsubmit = async e => { e.preventDefault(); try { await pb.collection('users').update(u.id, Object.fromEntries(new FormData(e.target))); toast('Saved'); } catch (x) { toast(x.message, 1); } };
  }
}, support: true, live: ['plans', 'subscriptions', 'payments', 'payouts', 'fees'], onLive: (c, e) => {
  if (e.action !== 'update' || e.record.status === 'pending') return;
  if (c === 'payments') toast('Your payment of ' + naira(e.record.amount) + ' was ' + e.record.status + '.', e.record.status === 'rejected');
  if (c === 'fees') toast('Your ' + (FEE_LABEL[e.record.type] || 'fee').toLowerCase() + ' payment of ' + naira(e.record.amount) + ' was ' + e.record.status + '.', e.record.status === 'rejected');
  if (c === 'payouts') toast('Your payout request was ' + (e.record.status === 'confirmed' ? 'approved' : e.record.status) + '.', e.record.status === 'rejected');
} });

// Coming back from Flutterwave (?status=...&tx_ref=...): ask the server to verify, then tidy the URL.
// The server asks Flutterwave itself, so editing this URL cannot fake a payment.
(async () => {
  const sp = new URLSearchParams(location.search), ref = sp.get('tx_ref');
  if (ref) {
    history.replaceState(null, '', location.pathname + '#payments');
    toast('Confirming your payment…', 0, 4000);
    try {
      const r = await pb.send('/api/noble/pay/verify', { method: 'POST', body: { tx_ref: ref, cancelled: sp.get('status') === 'cancelled' } });
      const done = { payment: 'Payment confirmed. Thank you!', shirt: 'Payment confirmed. You are now a registered member!', join: 'Payment confirmed. You have joined the plan!', clearance: 'Clearance fee confirmed. Your payout request has been sent.' };
      toast(r.status === 'confirmed' ? (done[r.type] || done.payment) : r.status === 'rejected' ? 'That payment was not completed.' : 'We have not received confirmation yet. This page updates automatically once it arrives.', r.status === 'rejected', 7000);
      if (r.status === 'confirmed') history.replaceState(null, '', location.pathname + '#' + ({ join: 'mine', clearance: 'payouts', shirt: 'overview' }[r.type] || 'payments'));
    } catch (x) { toast(x.message, 1); }
  }
  try { await pb.collection('users').authRefresh(); } catch (x) { }   // picks up a freshly confirmed registration
  needShirt() ? gate() : startApp();
})();
}
</script></body></html>
