<div class="w-full max-w-md">

  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8">
    <div class="grid grid-cols-2 bg-slate-100 rounded-lg p-1 mb-6 text-sm font-medium"><button type="button" id="t-login" class="py-2 rounded-md">Log in</button><button type="button" id="t-register" class="py-2 rounded-md">Sign up</button></div>
    <h1 id="ttl" class="text-xl font-semibold text-slate-900"></h1>
    <p id="sub" class="text-sm text-slate-500 mt-1 mb-5"></p>
    <form id="f" class="space-y-4" novalidate></form>
    <p id="err" role="alert" class="hidden mt-4 text-sm text-red-700 bg-red-50 ring-1 ring-red-200 rounded-lg px-3 py-2"></p>
    <p id="alt" class="text-sm text-slate-500 text-center mt-6"></p>
  </div>
  <a href="index.html" class="block text-center text-sm text-emerald-100/70 hover:text-white mt-6">&larr; Back to home</a>
</div>

const C=RAW.split('\n').map(l=>{const [i,n,d]=l.split('|');return{i,n,d}}).sort((a,b)=>a.n.localeCompare(b.n));

// ---------- small helpers ----------
const flag=(c,cls='w-5 h-[15px]')=>`<img src="https://flagcdn.com/w40/${c.i.toLowerCase()}.png" alt="" class="${cls} rounded-[2px] object-cover shrink-0" onerror="this.style.visibility='hidden'">`;
const EYE='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>';
const svg=p=>`<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const L=(t,id)=>`<label for="${id}" class="text-sm font-medium text-slate-700">${t}</label>`;
const field=(label,name,type,ac,extra='',hint='')=>`<div>${L(label,name)}<input id="${name}" name="${name}" type="${type}" autocomplete="${ac}" ${extra} class="${inp} mt-1">${hint?`<p class="text-xs text-slate-500 mt-1">${hint}</p>`:''}</div>`;
const pwField=(label,name,ac,hint='')=>`<div>${L(label,name)}<div class="relative mt-1"><input id="${name}" name="${name}" type="password" autocomplete="${ac}" required minlength="8" class="${inp} pr-11"><button type="button" data-eye="${name}" aria-label="Show password" class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1.5 rounded-md text-slate-400 hover:text-slate-700">${svg(EYE)}</button></div>${hint?`<p class="text-xs text-slate-500 mt-1">${hint}</p>`:''}</div>`;

let mode=new URLSearchParams(location.search).get('mode')==='register'?'register':'login';
let sel=C.find(c=>c.i==='NG');   // default country, changeable
let shown=[],act=-1;

// ---------- page ----------
function draw(){
 ['login','register'].forEach(m=>$('#t-'+m).className='py-2 rounded-md transition '+(m===mode?'bg-white shadow text-slate-900':'text-slate-500 hover:text-slate-700'));
 const reg=mode==='register';
 $('#ttl').textContent=reg?'Create your account':'Welcome back';
 $('#sub').textContent=reg?'Join Nobles Groceries and start saving today.':'Log in to manage your savings plans.';
 $('#alt').innerHTML=reg?'Already have an account? <button type="button" id="sw" class="text-emerald-800 font-medium hover:underline">Log in</button>':'New to Nobles Groceries? <button type="button" id="sw" class="text-emerald-800 font-medium hover:underline">Create an account</button>';
 $('#sw').onclick=()=>{mode=reg?'login':'register';draw()};
 $('#f').innerHTML=(reg?
   field('Full name','name','text','name','required placeholder="e.g. Ada Okafor"')
  +`<div>${L('Country','country-q')}
     <div class="relative mt-1">
       <span id="cb-flag" class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></span>
       <input id="country-q" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="cb-list" placeholder="Search for your country" class="${inp} pl-11 pr-9">
       <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
       <ul id="cb-list" role="listbox" class="hidden absolute z-20 mt-1 w-full max-h-56 overflow-auto rounded-lg border border-slate-200 bg-white shadow-lg py-1 text-sm"></ul>
     </div></div>`
  +`<div>${L('Phone number','phone')}
     <div class="flex mt-1 gap-2">
       <div id="dial" class="inline-flex items-center gap-2 px-3 rounded-lg border border-slate-300 bg-slate-50 text-sm text-slate-700 whitespace-nowrap select-none"></div>
       <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required placeholder="801 234 5678" class="${inp}">
     </div>
     <p class="text-xs text-slate-500 mt-1">Enter your number without the country code or leading 0.</p></div>`:'')
 +field('Email address','email','email',reg?'email':'username','required placeholder="you@example.com"')
 +pwField('Password',reg?'password':'password',reg?'new-password':'current-password',reg?'At least 8 characters.':'')
 +(reg?pwField('Confirm password','passwordConfirm','new-password'):'')
 +(reg?`<div class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-900"><p class="text-sm font-semibold">Before you join</p><ul class="list-disc pl-4 mt-1 space-y-0.5"><li>One-time t-shirt registration fee: <b>${naira(FEES.shirt)}</b>. It is compulsory: until it is paid you cannot do anything else on the site.</li><li>Joining fee: <b>${naira(FEES.join)}</b>, paid before you join any plan.</li><li>Payout clearance fee: <b>${naira(FEES.clearance)}</b>, paid with every payout request.</li></ul></div>
  <label class="flex items-start gap-2 text-sm text-slate-700 cursor-pointer"><input id="terms" type="checkbox" class="mt-0.5 w-4 h-4 shrink-0 accent-emerald-700"><span>I have read and accept the <a href="terms.html" target="_blank" class="text-emerald-800 underline">Terms and Conditions</a>, including these fees.</span></label>`:'')
 +`<button id="go" class="${btn} w-full py-2.5 mt-1">${reg?'Create account':'Log in'}</button>`;
 hideErr();
 document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=svg(show?EYE_OFF:EYE);b.setAttribute('aria-label',show?'Hide password':'Show password')});
 if(reg)initCountry();
}

// ---------- searchable country picker ----------
function initCountry(){
 const q=$('#country-q'),list=$('#cb-list');
 const paint=()=>{$('#cb-flag').innerHTML=flag(sel);$('#dial').innerHTML=flag(sel)+'<span>+'+sel.d+'</span>';q.value=sel.n};
 const open=()=>{list.classList.remove('hidden');q.setAttribute('aria-expanded','true')};
 const close=()=>{list.classList.add('hidden');q.setAttribute('aria-expanded','false');act=-1;paint()};
 const pick=c=>{sel=c;close();$('#phone').focus()};
 const render=txt=>{
  const s=txt.trim().toLowerCase().replace(/^\+/,'');
  shown=!s?C:C.filter(c=>/^\d+$/.test(s)?c.d.startsWith(s):(c.n.toLowerCase().includes(s)||c.i.toLowerCase()===s))
         .sort((a,b)=>(b.n.toLowerCase().startsWith(s))-(a.n.toLowerCase().startsWith(s)));
  act=shown.length&&s?0:shown.indexOf(sel);
  list.innerHTML=shown.length?shown.map((c,i)=>`<li role="option" data-i="${i}" class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-slate-100 ${i===act?'bg-slate-100':''}">${flag(c)}<span class="text-slate-800">${esc(c.n)}</span><span class="ml-auto text-slate-400">+${c.d}</span></li>`).join(''):'<li class="px-3 py-3 text-slate-500">No country found</li>';
  const a=list.querySelector('.bg-slate-100');if(a)a.scrollIntoView({block:'nearest'});
 };
 const mark=()=>{list.querySelectorAll('li[data-i]').forEach(li=>li.classList.toggle('bg-slate-100',+li.dataset.i===act));const a=list.querySelector(`li[data-i="${act}"]`);if(a)a.scrollIntoView({block:'nearest'})};
 paint();
 q.onfocus=()=>{render('');open();q.select()};
 q.onclick=()=>{if(list.classList.contains('hidden')){render('');open();q.select()}};
 q.oninput=()=>{render(q.value);open()};
 q.onblur=close;
 q.onkeydown=e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.classList.contains('hidden')){render('');open()}if(!shown.length)return;act=(act+(e.key==='ArrowDown'?1:-1)+shown.length)%shown.length;mark()}
  else if(e.key==='Enter'){e.preventDefault();if(!list.classList.contains('hidden')&&shown[act])pick(shown[act])}
  else if(e.key==='Escape'){close()}
 };
 list.onmousedown=e=>{e.preventDefault();const li=e.target.closest('li[data-i]');if(li)pick(shown[+li.dataset.i])};
 $('#phone').oninput=e=>{e.target.value=e.target.value.replace(/[^\d\s-]/g,'')};
}

// ---------- feedback ----------
const showErr=m=>{const e=$('#err');e.textContent=m;e.classList.remove('hidden')};
const hideErr=()=>{const e=$('#err');e.textContent='';e.classList.add('hidden')};
const busy=on=>{const b=$('#go');b.disabled=on;b.classList.toggle('opacity-70',on);b.textContent=on?'Please wait…':(mode==='register'?'Create account':'Log in')};

// ---------- submit ----------
$('#t-login').onclick=()=>{mode='login';draw()};
$('#t-register').onclick=()=>{mode='register';draw()};
$('#f').onsubmit=async e=>{
 e.preventDefault();hideErr();
 const d=Object.fromEntries(new FormData(e.target));
 const email=(d.email||'').trim();
 try{
  if(!email||!d.password)throw new Error('Enter your email and password.');
  if(mode==='register'){
   if(!(d.name||'').trim())throw new Error('Enter your full name.');
   if(!sel)throw new Error('Please choose your country from the list.');
   const digits=(d.phone||'').replace(/\D/g,'').replace(/^0+/,'');
   if(digits.length<6||digits.length>12)throw new Error('Enter a valid phone number.');
   if(d.password.length<8)throw new Error('Password must be at least 8 characters.');
   if(d.password!==d.passwordConfirm)throw new Error('Passwords do not match.');
   if(!$('#terms').checked)throw new Error('Please accept the Terms and Conditions to create your account.');
   busy(true);
   await pb.collection('users').create({name:d.name.trim(),email,password:d.password,passwordConfirm:d.passwordConfirm,country:sel.n,phone:'+'+sel.d+digits,emailVisibility:true,terms_accepted:true});
  }
  busy(true);
  await pb.collection('users').authWithPassword(email,d.password);
  location.href=pb.authStore.record.role==='admin'?'admin.html':'dashboard.html';
 }catch(x){
  busy(false);
  const m=Object.values(x.response?.data||{}).map(v=>v.message).join(' ');
  showErr(m||(x.status===0?'Can\u2019t reach the server. Check your internet connection and try again.':(mode==='login'&&x.status===400?'Incorrect email or password.':x.message)));
 }
};
draw();
})();
</script></body></html>
